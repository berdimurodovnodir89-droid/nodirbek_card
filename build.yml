name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda android/ papkasi bo'lmasa, avtomatik yaratiladi
      - name: Android platformasini yaratish
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org uz.nodirbek --project-name nodirbek_card .
            rm -rf test
          fi

      - name: AndroidManifest ga queries qo'shish
        run: python3 tool/patch_manifest.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nodirbek-card-apk
          path: build/app/outputs/flutter-apk/app-release.apk
